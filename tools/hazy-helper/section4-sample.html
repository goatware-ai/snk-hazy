<!-- Section 4 (Task Rubrics) in its ARRIVAL state, copied from a capture of the real
     page. rubric-sample.html holds the same section after every row has been expanded;
     this one holds what you actually get when you open the form, and the difference is
     the whole point of the file.

     Three rubric rows exist. ONLY THE FIRST is open. Rows 2 and 3 carry data-hidden and
     data-closed, and their panels are not in the DOM at all: no description textarea, no
     weight input, just a header button. So counting rows by "instances that contain a
     description field" returns 1, not 3. Anything that then tops the list up to the
     criterion count adds a full set of new rows on top of the three already present.

     Rows must be counted by their instance containers, which exist whether or not the row
     is expanded, and the fields read only after expanding.

     Two more things the live form showed, both recorded here:

       - The trigger's data-value lists the indices currently OPEN, e.g.
         data-value="0,23,24,25,22,21,20,19,18,17,16,15" on a 26-row rubric where only
         twelve rows were open. Several rows can be open at once.
       - Every row header carries a "Delete section" button, which is what makes removing
         surplus rows possible when a revision has fewer criteria than the form has rows. -->
