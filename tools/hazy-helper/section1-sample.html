<!-- Section 1 as the live form renders it, reduced to the structure page.js relies on.
     Every attribute shape here is copied from a capture of the real page: the panel's
     role="region" and bare data-open, the two field containers, the per-option
     data-testid="radio-option-container-<exact label>", and the fact that the element you
     can actually click is the button[role=radio] - the <input type=radio> beside it is
     aria-hidden and clipped out of the layout.

     Note the panel does NOT carry the section's data-testid; the section wrapper does, and
     the panel sits inside it. Scoping has to survive that.

     The occupation list is trimmed to nine entries. The domain list is complete, because
     its slugs are what prove the value rule: "Healthcare Practitioners / Support" collapses
     a slash-with-spaces to one underscore, and "Installation, Maintenance, and Repair"
     collapses a comma-space the same way. -->
